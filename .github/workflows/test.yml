name: Test templates
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run package
      - run: unzip -l dist/reachdog-n8n-templates-*.zip
      - uses: actions/upload-artifact@v4
        with:
          name: reachdog-n8n-templates-zip
          path: dist/*.zip
